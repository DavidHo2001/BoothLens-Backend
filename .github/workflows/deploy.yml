name: Deploy Spring Boot to EC2

# This workflow triggers whenever you push to the 'main' branch
on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Get the latest code
      - name: Checkout Code
        uses: actions/checkout@v3

      # 2. Set up Java (Change '17' to '21' if you are using Java 21)
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # 3. Build the JAR file
      - name: Build with Maven
        run: mvn clean package -DskipTests

      # 4. Copy the JAR file to your EC2 instance
      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v0.1.7  # 🌟 不要用 @master，改用特定版本
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # Path to the generated JAR in GitHub runner
          source: "target/boothlens-backend-0.0.1-SNAPSHOT.jar"
          # Destination folder on EC2
          target: "/home/ubuntu/SpringBackend/"
          # This removes the 'target/' directory structure when copying
          strip_components: 1

      # 5. SSH into EC2 and restart the service
      - name: Restart Spring Boot Service
        uses: appleboy/ssh-action@v1.0.3  # 🌟 不要用 @master，改用特定版本
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo systemctl restart boothlens
            sudo systemctl status boothlens --no-pager
